---
services:
  backend:
    image: mdcollab/backend:latest
    volumes:
      - ./.env:/usr/src/app/backend/.env
      - mdcollab_uploads:/usr/src/app/backend/uploads

  frontend:
    image: mdcollab/frontend:latest
    environment:
      MDCOLLAB_BASE_URL: "${MDCOLLAB_BASE_URL}"

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: "${MDCOLLAB_DATABASE_USERNAME}"
      POSTGRES_PASSWORD: "${MDCOLLAB_DATABASE_PASSWORD}"
      POSTGRES_DB: "${MDCOLLAB_DATABASE_NAME}"

  proxy:
    image: caddy:latest
    restart: unless-stopped
    environment:
      MDCOLLAB_BASE_URL: "${MDCOLLAB_BASE_URL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  mdcollab_uploads:
  caddy_data:
