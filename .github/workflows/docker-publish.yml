name: Build and Publish Docker Image

on:
  push:
    tags:
      - "v*"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend Docker metadata
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=ref,event=tag,priority=900
            type=match,pattern=^v(\d+\.\d+\.\d+\.\d+\.\d+),group=1,prefix=v,priority=850
            type=match,pattern=^v(\d+\.\d+\.\d+\.\d+),group=1,prefix=v,priority=840
            type=match,pattern=^v(\d+\.\d+\.\d+),group=1,prefix=v,priority=830
            type=match,pattern=^v(\d+\.\d+),group=1,prefix=v,priority=820
            type=match,pattern=^v(\d+),group=1,prefix=v,priority=810
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/docker/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract frontend Docker metadata
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=ref,event=tag,priority=900
            type=match,pattern=^v(\d+\.\d+\.\d+\.\d+\.\d+),group=1,prefix=v,priority=850
            type=match,pattern=^v(\d+\.\d+\.\d+\.\d+),group=1,prefix=v,priority=840
            type=match,pattern=^v(\d+\.\d+\.\d+),group=1,prefix=v,priority=830
            type=match,pattern=^v(\d+\.\d+),group=1,prefix=v,priority=820
            type=match,pattern=^v(\d+),group=1,prefix=v,priority=810
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/docker/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
