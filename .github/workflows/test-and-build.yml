name: Run tests & build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  pull_request_target:
    branches: [ develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
  cancel-in-progress: true

jobs:
  build:
    if: "(github.event_name == 'pull_request_target') == github.event.pull_request.head.repo.fork"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ '24' ] # Are you changing this? Don't forget to update the min. and recommended node version in docs/content/how-to/develop/setup.md!
        include:
          - node: '24'
            coverage: true
    name: Test and build with NodeJS ${{ matrix.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup node
        uses: ./.github/actions/setup-node
        with:
          NODEJS_VERSION: ${{ matrix.node }}

      - name: Build project
        run: pnpm run build
        shell: bash
        env:
          NODEJS_VERSION: ${{ matrix.node }}

      - name: Test Project
        run: pnpm run test:ci
        shell: bash
        env:
          NODEJS_VERSION: ${{ matrix.node }}
