services:
  backend:
    image: mdcollab/backend:latest
    volumes:
      - $PWD/.env:/usr/src/app/backend/.env
      - mdcollab_uploads:/usr/src/app/backend/uploads

  frontend:
    image: mdcollab/frontend:latest
    environment:
      MDCOLLAB_BASE_URL: "${MDCOLLAB_BASE_URL}"
      MDCOLLAB_INTERNAL_API_URL: http://backend:3000
      HOSTNAME: "0.0.0.0"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${MDCOLLAB_DATABASE_USERNAME}"
      POSTGRES_PASSWORD: "${MDCOLLAB_DATABASE_PASSWORD}"
      POSTGRES_DB: "${MDCOLLAB_DATABASE_NAME}"
    volumes:
      - mdcollab_postgres:/var/lib/postgresql/data

  proxy:
    image: caddy:latest
    restart: unless-stopped
    environment:
      MDCOLLAB_BASE_URL: "${MDCOLLAB_BASE_URL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - $PWD/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  caddy_data:
  mdcollab_uploads:
  mdcollab_postgres: